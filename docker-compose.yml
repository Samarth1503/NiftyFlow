services:
  db:
    image: postgres:15-alpine
    container_name: niftyflow_db
    environment:
      POSTGRES_USER: nifty_user
      POSTGRES_PASSWORD: nifty_password
      POSTGRES_DB: niftyflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: niftyflow_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
